name: build
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Sublite job id
        required: true
      platform:
        description: apk, aab or exe
        required: false
        default: apk
jobs:
  windows:
    if: ${{ inputs.platform == 'exe' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      JOB_ID: ${{ inputs.job_id }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Prepare desktop project
        run: python scripts/prepare_desktop.py "$JOB_ID"
      - name: Compile exe
        run: |
          set -o pipefail
          cd desktop-work
          npm install --no-audit --no-fund 2>&1 | tee ../build.log
          npx electron-builder --win portable --x64 --publish never 2>&1 | tee -a ../build.log
      - name: Publish artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release_desktop.sh "$JOB_ID"
  build:
    if: ${{ inputs.platform != 'exe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Prepare Android project
        run: python3 scripts/prepare.py "$JOB_ID"
      - name: Compile package
        run: |
          set -o pipefail
          PLATFORM=$(python3 -c "import json,sys;print(json.load(open('jobs/'+sys.argv[1]+'.json')).get('platform','apk'))" "$JOB_ID")
          cd work
          if [ "$PLATFORM" = "aab" ]; then
            gradle bundleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          fi
      - name: Publish artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh "$JOB_ID"
